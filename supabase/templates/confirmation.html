<!doctype html>
<!-- Potwierdzenie adresu przy rejestracji e-mailem (signUp / signInWithOtp z shouldCreateUser: true – aplikacja
     z nich nie korzysta) albo logowanie na adres jeszcze niepotwierdzony. Kod jak w pozostałych: verifyOtp type 'email'. -->
<html lang="pl">
  <body style="margin:0;padding:24px 16px;background:#FAF6EE;font-family:Helvetica,Arial,sans-serif;color:#2E2B25;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:16px;">
      <tr>
        <td style="padding:28px 24px;">
          <p style="margin:0 0 4px;font-size:13px;color:#6E685C;">Grzybobranie</p>
          <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;">Potwierdź adres e-mail</h1>
          <p style="margin:0 0 20px;font-size:15px;line-height:1.5;">
            Wpisz ten kod w aplikacji, żeby potwierdzić adres {{ .Email }}:
          </p>
          <p style="margin:0 0 20px;padding:16px;background:#EEF5E3;border-radius:12px;text-align:center;font-size:32px;letter-spacing:8px;font-weight:bold;font-family:'Courier New',monospace;color:#1F3310;">
            {{ .Token }}
          </p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#6E685C;">
            Kod jest ważny przez 15 minut i działa tylko raz. Jeśli to nie Ty, zignoruj tę wiadomość.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
